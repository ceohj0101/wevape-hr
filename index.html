<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE VAPE — 신입 면접 관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0f1e">
<style>
:root{--bg:#f4f6fb;--bg2:#eaecf4;--bg3:#dde1ee;--border:rgba(15,23,66,.1);--text:#0f172a;--muted:#5a6480;--accent:#f5c518;--accent2:#e6b400;--nav:#0d1424}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(150deg,#0a0f1e 0%,#0d1424 45%,#111a30 100%);border-bottom:3px solid var(--accent);padding:24px 24px 20px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(245,197,24,.06) 0%,transparent 60%);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;position:relative}
.hero-logo{height:36px;object-fit:contain;filter:brightness(1.2) drop-shadow(0 0 8px rgba(245,197,24,.3))}
.hero-logo-text{font-size:20px;font-weight:900;letter-spacing:.1em;color:#fff;display:none}.hero-logo-text span{color:var(--accent)}
.hero-region{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.hero-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.3px}
.hero-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:5px}
.header-right{display:flex;align-items:center;gap:8px}
.update-time{font-size:10px;color:rgba(255,255,255,.35)}
.reload-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s}
.reload-btn:hover{background:rgba(255,255,255,.18)}.reload-btn:disabled{opacity:.4;cursor:not-allowed}
.add-btn{background:var(--accent);border:none;color:#1a1000;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:900;cursor:pointer;transition:background .15s}
.add-btn:hover{background:var(--accent2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:18px 24px 0}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(15,23,66,.06)}
.stat-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-num{font-size:28px;font-weight:900;line-height:1;color:var(--text)}
.stat-card.accent .stat-num{color:#3b5fe8}.stat-card.green .stat-num{color:#16a34a}.stat-card.red .stat-num{color:#dc2626}
.stat-card.accent{border-color:rgba(91,127,245,.2);background:rgba(91,127,245,.04)}
.stat-card.green{border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.04)}
.stat-card.red{border-color:rgba(220,38,38,.2);background:rgba(220,38,38,.04)}
.emp-section{padding:16px 24px 0}
.section-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 6px rgba(34,197,94,.5)}
.section-title{font-size:12px;font-weight:800;color:#15803d}
.section-cnt{font-size:10px;color:var(--muted);background:var(--bg3);padding:2px 8px;border-radius:20px;border:1px solid var(--border)}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.emp-card{background:#fff;border:1px solid rgba(74,222,128,.25);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s;border-left:3px solid #22c55e}
.emp-card:hover,.emp-card.open{border-color:rgba(74,222,128,.5)}
.emp-card-head{display:flex;align-items:center;gap:9px}
.emp-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0;background:#22c55e}
.emp-name{font-size:13px;font-weight:800;color:var(--text)}.emp-role{font-size:10px;color:var(--muted);margin-top:1px}
.emp-tenure{margin-left:auto;font-size:9px;font-weight:700;color:#15803d;background:rgba(74,222,128,.12);padding:2px 7px;border-radius:10px;white-space:nowrap}
.emp-hire{font-size:10px;color:#15803d;margin-top:6px}
.emp-detail{display:none;padding-top:8px;border-top:1px solid rgba(74,222,128,.15);margin-top:8px;font-size:10px;color:var(--muted)}
.emp-card.open .emp-detail{display:block}
.divider{height:1px;background:var(--border);margin:16px 24px 0}
.pipeline-wrap{padding:14px 24px 0}
.pipeline-title{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.pipeline{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}.pipeline::-webkit-scrollbar{display:none}
.pipe{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer;flex-shrink:0;transition:all .15s;min-width:72px}
.pipe:hover{border-color:rgba(15,23,66,.2)}.pipe.active{border-color:var(--accent);background:rgba(245,197,24,.07)}
.pipe-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pipe-info .pipe-name{font-size:9px;font-weight:700;color:var(--muted)}.pipe-info .pipe-cnt{font-size:17px;font-weight:900;color:var(--text);line-height:1.1}
.pipe-arrow{color:var(--muted);font-size:11px;margin:0 2px;flex-shrink:0}
.content{padding:14px 24px}
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}
.chip{padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;transition:border-color .15s;background:var(--bg3);color:var(--muted)}
.chip:hover{color:var(--text)}.chip.active{color:var(--text);border-color:var(--accent);background:rgba(245,197,24,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .12s;overflow:hidden;border-left:4px solid var(--sc);box-shadow:0 1px 4px rgba(15,23,66,.06)}
.card:hover{border-color:rgba(15,23,66,.18);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,66,.1)}.card.open{border-color:rgba(15,23,66,.2)}
.card-inner{padding:14px}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;flex-shrink:0}
.card-name{font-size:14px;font-weight:800;color:var(--text)}.card-sub{font-size:10px;color:var(--muted);margin-top:2px}
.badge{margin-left:auto;display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:800;white-space:nowrap;flex-shrink:0}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.del-btn{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.25);color:#dc2626;border-radius:7px;padding:3px 8px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s}
.del-btn:hover{background:rgba(220,38,38,.15)}
.resume-btn{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.45);color:#7a5f00;border-radius:7px;padding:3px 9px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s;margin-left:4px}
.resume-btn:hover{background:rgba(245,197,24,.25)}
.card-date-banner{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(245,197,24,.07);border-radius:9px;margin:0 12px 9px;border:1px solid rgba(245,197,24,.2)}
.card-date-main{font-size:17px;font-weight:900;color:var(--text);letter-spacing:-.4px}
.card-dday{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;background:rgba(91,127,245,.1);color:#3b5fe8;white-space:nowrap}
.card-dday.today{background:var(--accent);color:#1a1000}.card-dday.past{background:rgba(100,116,139,.1);color:var(--muted)}
.card-date-banner.today{background:linear-gradient(135deg,#f5c518,#ffd84d);border-color:#e6b400;box-shadow:0 2px 12px rgba(245,197,24,.45)}
.card-date-banner.today .card-date-main{color:#1a1000}
.card-date-banner.today .card-dday{background:#1a1000;color:#f5c518}
.card-eval-wrap{padding:0 12px;margin-bottom:9px}
.card-eval-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.card-eval-area{width:100%;min-height:76px;border:1.5px solid var(--border);border-radius:9px;padding:9px 10px;font-size:12px;color:var(--text);resize:vertical;background:#fafbff;font-family:inherit;transition:border-color .15s,box-shadow .15s;box-sizing:border-box;line-height:1.6;display:block}
.card-eval-area:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(245,197,24,.1)}
.card-eval-area.saving{border-color:rgba(91,127,245,.4)}.card-eval-area.saved{border-color:rgba(34,197,94,.5)}
.time-row{display:flex;align-items:center;gap:5px;padding:0 12px;margin-bottom:8px}
.time-row input[type=date]{flex:1;min-width:0}
.time-row input[type=time]{width:76px;flex-shrink:0}
.time-row .time-save-btn{flex-shrink:0}
.time-input{border:1px solid var(--border);border-radius:7px;padding:5px 7px;font-size:11px;color:var(--text);background:#fafbff;outline:none;cursor:pointer;font-family:inherit}
.time-input:focus{border-color:var(--accent)}
.time-save-btn{background:var(--accent);border:none;color:#1a1000;border-radius:7px;padding:5px 10px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s}
.time-save-btn:hover{background:var(--accent2)}
.action-btns{display:flex;gap:6px;padding:0 12px;margin-bottom:8px}
.act-btn{flex:1;min-width:0;padding:7px 0;border-radius:8px;border:1.5px solid;font-size:11px;font-weight:800;cursor:pointer;letter-spacing:.03em;transition:opacity .15s}
.act-btn:hover{opacity:.8}
.act-btn.pass{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4);color:#15803d}
.act-btn.fail{background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.3);color:#dc2626}
.act-btn.retry{background:rgba(245,197,24,.1);border-color:rgba(245,197,24,.5);color:#7a5f00}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--border)}
.stars{display:flex;align-items:center;gap:1px}.star{font-size:11px;color:#f59e0b}.star.off{color:#d1d5db}
.score-tag{font-size:9px;color:var(--muted);margin-left:3px}
.chevron{font-size:9px;color:var(--muted);transition:transform .2s}.card.open .chevron{transform:rotate(180deg)}
.detail{display:none;padding:12px 14px 14px;background:var(--bg);border-top:1px solid var(--border)}
.card.open .detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.df label{font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.df p{font-size:11px;color:#374151;line-height:1.5;white-space:pre-wrap;word-break:break-word}.df p.nil{color:#d1d5db}
.df.wide{grid-column:span 2}
.notion-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 11px;background:var(--bg3);border-radius:7px;border:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700;text-decoration:none;transition:background .15s}
.notion-btn:hover{background:var(--bg2)}
.loading{text-align:center;padding:56px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:#3b5fe8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{margin-top:12px;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:56px;color:var(--muted);font-size:12px}
.empty-icon{font-size:32px;margin-bottom:8px}
.error-box{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.25);border-radius:10px;padding:12px 14px;color:#dc2626;font-size:11px;line-height:1.6;margin-bottom:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,66,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,23,66,.2)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.modal-title{font-size:16px;font-weight:900;color:var(--text)}
.modal-close{background:var(--bg3);border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);background:#fafbff;outline:none;font-family:inherit;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);background:#fff}
.form-group textarea{min-height:70px;resize:vertical}
.img-zone{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:border-color .15s;position:relative;background:var(--bg)}
.img-zone:hover,.img-zone.drag{border-color:var(--accent)}
.img-zone.has-img{border-style:solid;border-color:rgba(34,197,94,.4)}
#imgPlaceholder{color:var(--muted);font-size:12px;pointer-events:none}
#imgPlaceholder span{font-size:28px;display:block;margin-bottom:6px}
#imgPreviewWrap{display:none}
#imgThumb{max-width:100%;max-height:200px;border-radius:8px;object-fit:contain}
.img-ai-status{margin-top:8px;font-size:10px;color:var(--muted)}
.img-ai-status.loading-ai{color:#3b5fe8}.img-ai-status.done{color:#16a34a}
.modal-footer{padding:0 20px 20px}
.submit-btn{width:100%;background:var(--accent);border:none;color:#1a1000;border-radius:10px;padding:12px;font-size:14px;font-weight:900;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:var(--accent2)}.submit-btn:disabled{opacity:.5;cursor:not-allowed}
#resumeLightbox{position:fixed;inset:0;background:rgba(10,15,30,.88);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(8px)}
.lb-inner{position:relative;max-width:520px;width:100%;margin:auto}
.lb-close{position:sticky;top:0;float:right;background:rgba(10,15,30,.8);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:-32px;z-index:1}
.lb-img{width:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:block;margin-top:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2035;color:#fff;border-radius:10px;padding:10px 18px;font-size:12px;font-weight:700;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.err{background:#dc2626}
.app-shell{display:flex;align-items:flex-start}
.sidebar{width:168px;flex-shrink:0;padding:20px 12px;position:sticky;top:0;display:flex;flex-direction:column;gap:6px}
.side-btn{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;text-align:left;transition:background .15s,color .15s;width:100%}
.side-btn:hover{background:var(--bg3)}
.side-btn.active{background:rgba(245,197,24,.16);color:#7a5f00}
.main-view{flex:1;min-width:0}
.att-input{width:38px;padding:3px 4px;text-align:center}
@media (max-width:640px){.app-shell{flex-direction:column}.sidebar{flex-direction:row;width:100%;position:static;padding:12px 16px}}
.footer{text-align:center;padding:20px;font-size:10px;color:rgba(255,255,255,.3);border-top:2px solid rgba(245,197,24,.2);margin-top:20px;background:linear-gradient(135deg,#0a0f1e 0%,#0d1424 100%)}
.footer a{color:rgba(245,197,24,.5);text-decoration:none}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <img class="hero-logo" src="https://github.com/user-attachments/assets/7ac07bf2-100b-4129-8124-d389a21c5cd9" alt="WE VAPE"
        onerror="this.style.display='none';document.getElementById('lt').style.display='block'">
      <div id="lt" class="hero-logo-text" style="display:none">WE<span>VAPE</span></div>
    </div>
    <div class="header-right">
      <span class="update-time" id="lastUpdate"></span>
      <button class="reload-btn" id="reloadBtn" onclick="loadData()">↻ 새로고침</button>
      <button class="reload-btn" id="installBtn" onclick="installApp()">⬇ 다운로드</button>
      <button class="add-btn" onclick="openModal()">+ 지원자 추가</button>
    </div>
  </div>
  <div>
    <div class="hero-region">인천 · 경기 지점</div>
    <div class="hero-title">신입 면접 관리</div>
    <div class="hero-sub">지원자 현황 및 채용 파이프라인</div>
  </div>
</div>

<div class="app-shell">
  <nav class="sidebar">
    <button class="side-btn active" id="navNew" onclick="switchView('new')">🆕 신입 정보</button>
    <button class="side-btn" id="navEmp" onclick="switchView('emp')">👥 재직자 정보</button>
  </nav>
  <div class="main-view">
    <div id="viewNew">
      <div class="stats" id="stats"></div>
      <div class="pipeline-wrap"><div class="pipeline-title">채용 파이프라인</div><div class="pipeline" id="pipeline"></div></div>
      <div class="content">
        <div class="loading" id="loadingEl"><div class="spinner"></div><p>데이터 불러오는 중...</p></div>
        <div id="mainContent" style="display:none">
          <div id="errorBox" style="display:none"></div>
          <div class="filter-row" id="filterRow"></div>
          <div class="filter-row" id="monthFilterRow"></div>
          <div class="grid" id="grid"></div>
          <div class="empty" id="emptyEl" style="display:none"><div class="empty-icon">🔍</div><p>해당 조건의 지원자가 없어요.</p></div>
        </div>
      </div>
    </div>
    <div id="viewEmp" style="display:none">
      <div class="stats" id="empStats"></div>
      <div class="emp-section" id="empSection" style="display:none;padding:16px 24px 24px">
        <div class="section-hd"><div class="section-dot"></div><span class="section-title">재직중 직원</span><span class="section-cnt" id="empCnt">0명</span><button class="section-cnt" id="retiredToggle" style="display:none;cursor:pointer;margin-left:4px" onclick="toggleRetired()"></button></div>
        <div class="emp-grid" id="empGrid"></div>
      </div>
      <div class="empty" id="empEmptyEl" style="display:none;padding:56px 24px"><div class="empty-icon">🧑‍💼</div><p>재직중인 직원이 없습니다.</p></div>
    </div>
  </div>
</div>
<div class="footer">We Vape — 신입 면접 관리 내부 운영 자료 · <a href="https://app.notion.com/p/8887bdc6711744e78475aed069f808ca" target="_blank">노션 원본</a></div>

<!-- 지원자 추가 모달 -->
<div class="modal-overlay" id="addModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">+ 신규 지원자 등록</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

<!-- 이력서 라이트박스 -->
<div id="resumeLightbox" style="display:none" onclick="if(event.target===this)closeLightbox()">

<input type="file" id="attachFileInput" accept="image/*" style="display:none" onchange="handleAttachUpload(event)">
<div id="toast"></div>

<script>
const WORKER = 'https://wevape-notion.ceohj01.workers.dev/';
const SM = {
  '서류접수':{color:'#64748b',bg:'rgba(100,116,139,.12)',dot:'#94a3b8'},
  '서류합격':{color:'#2563eb',bg:'rgba(37,99,235,.1)',dot:'#3b82f6'},
  '면접대기':{color:'#d97706',bg:'rgba(217,119,6,.1)',dot:'#f59e0b'},
  '면접예정':{color:'#7c3aed',bg:'rgba(124,58,237,.1)',dot:'#8b5cf6'},
  '면접완료':{color:'#c2410c',bg:'rgba(194,65,12,.1)',dot:'#f97316'},
  '최종합격':{color:'#15803d',bg:'rgba(21,128,61,.1)',dot:'#22c55e'},
  '불합격':{color:'#dc2626',bg:'rgba(220,38,38,.1)',dot:'#ef4444'},
};
const FSM = {color:'#64748b',bg:'rgba(100,116,139,.12)',dot:'#94a3b8'};
const PIPELINE = ['서류접수','서류합격','면접대기','면접예정','면접완료'];
const REJ=['불합격','불참','콜백없음'];
const cntRej=()=>rows.filter(r=>REJ.includes(r['진행상태'])).length;
const STAGE_ACTIONS = {
  '서류접수':[{label:'서류합격 →',next:'서류합격',cls:'pass'},{label:'면접대기 →',next:'면접대기',cls:'pass'},{label:'연락없음',next:'콜백없음',cls:'fail'},{label:'✕ 불합격',next:'불합격',cls:'fail'}],
  '서류합격':[{label:'↩',next:'서류접수',cls:'retry'},{label:'면접대기 →',next:'면접대기',cls:'pass'},{label:'✕ 불합격',next:'불합격',cls:'fail'}],
  '면접대기':[{label:'↩',next:'서류합격',cls:'retry'},{label:'면접예정 →',next:'면접예정',cls:'pass'},{label:'✕ 불합격',next:'불합격',cls:'fail'}],
  '면접예정':[{label:'↩',next:'면접대기',cls:'retry'},{label:'면접완료 →',next:'면접완료',cls:'pass'},{label:'불참',next:'불참',cls:'fail'},{label:'✕ 불합격',next:'불합격',cls:'fail'}],
  '면접완료':[{label:'↩',next:'면접예정',cls:'retry'},{label:'✓ 최종합격',next:'최종합격',cls:'pass'},{label:'✕ 불합격',next:'불합격',cls:'fail'}],
  '불합격':[{label:'↺ 재검토',next:'서류접수',cls:'retry'}],
  '불참':[{label:'↺ 재검토',next:'면접대기',cls:'retry'}],
  '콜백없음':[{label:'↺ 재검토',next:'서류접수',cls:'retry'}],
};
const AV=['#6366f1','#8b5cf6','#ec4899','#0ea5e9','#f97316','#22c55e','#a855f7','#14b8a6','#f59e0b'];
let rows=[], flt='all', monthFlt='all', openIdx=null, empOpenIdx=null, _imgBase64=null, _imgOrigUrl=null;

// ===== DATA =====
async function loadData(){
  const btn=document.getElementById('reloadBtn');
  btn.disabled=true;btn.textContent='...';
  document.getElementById('loadingEl').style.display='block';
  document.getElementById('mainContent').style.display='none';
  document.getElementById('stats').innerHTML='';
  document.getElementById('pipeline').innerHTML='';
  try{
    const r=await fetch(WORKER+'?_='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    rows=d.records||[];
    if(d.updatedAt){
      const t=new Date(d.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      document.getElementById('lastUpdate').textContent=t+' 업데이트';
    }
  }catch(e){
    rows=[];
    showError('⚠️ 로드 실패: '+e.message);
  }
  btn.disabled=false;btn.textContent='↻ 새로고침';
  document.getElementById('loadingEl').style.display='none';
  document.getElementById('mainContent').style.display='block';
  if(!window._fltInit){window._fltInit=1;if(rows.some(r=>r['진행상태']==='면접예정'))flt='면접예정';}
  renderAll();
}

function renderAll(){renderStats();renderEmpStats();renderEmployees();renderPipeline();renderFilters();renderMonthFilters();renderCards();}

// ===== SIDEBAR VIEW SWITCH =====
function switchView(v){
  document.getElementById('viewNew').style.display=v==='new'?'block':'none';
  document.getElementById('viewEmp').style.display=v==='emp'?'block':'none';
  document.getElementById('navNew').classList.toggle('active',v==='new');
  document.getElementById('navEmp').classList.toggle('active',v==='emp');
}
const cnt=s=>rows.filter(r=>r['진행상태']===s).length;

function showError(msg){
  const eb=document.getElementById('errorBox');
  eb.textContent=msg;eb.className='error-box';eb.style.display='block';
  setTimeout(()=>{eb.style.display='none';},6000);
}

// ===== STATS =====
function renderStats(){
  const applicants=rows.filter(r=>r['진행상태']!=='최종합격').length;
  const inP=cnt('서류접수')+cnt('서류합격')+cnt('면접대기')+cnt('면접예정')+cnt('면접완료');
  const ym=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))(new Date());
  const newHires=rows.filter(r=>r['진행상태']==='최종합격'&&(r['입사일']||'').startsWith(ym)).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><div class="stat-label">총 지원자</div><div class="stat-num">${applicants}</div></div>
    <div class="stat-card accent"><div class="stat-label">진행 중</div><div class="stat-num">${inP}</div></div>
    <div class="stat-card green"><div class="stat-label">재직중</div><div class="stat-num">${rows.filter(r=>r['진행상태']==='최종합격'&&!r['퇴사일']).length}</div></div>
    <div class="stat-card accent"><div class="stat-label">이달 합격</div><div class="stat-num">${newHires}</div></div>
    <div class="stat-card red"><div class="stat-label">불합격·불참</div><div class="stat-num">${cntRej()}</div></div>`;
}

// ===== EMPLOYEE STATS (재직자 정보 탭) =====
function renderEmpStats(){
  const wrap=document.getElementById('empStats');
  if(!wrap)return;
  const emps=rows.filter(r=>r['진행상태']==='최종합격'&&!r['퇴사일']);
  const ym=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))(new Date());
  const newThisMonth=emps.filter(r=>(r['입사일']||'').startsWith(ym)).length;
  const withHire=emps.filter(r=>r['입사일']);
  let avgMonths=0;
  if(withHire.length){
    const total=withHire.reduce((sum,r)=>{
      const s=new Date(r['입사일'].substring(0,10)),n=new Date();
      let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());
      if(n.getDate()<s.getDate())m--;
      return sum+Math.max(m,0);
    },0);
    avgMonths=Math.round(total/withHire.length);
  }
  wrap.innerHTML=`
    <div class="stat-card green"><div class="stat-label">재직 인원</div><div class="stat-num">${emps.length}</div></div>
    <div class="stat-card accent"><div class="stat-label">이번달 입사</div><div class="stat-num">${newThisMonth}</div></div>
    <div class="stat-card"><div class="stat-label">평균 근속(개월)</div><div class="stat-num">${avgMonths}</div></div>`;
}

// ===== ATTENDANCE (근태, 로컬 저장 — 기기별) =====
function getAtt(pidClean){
  try{return JSON.parse(localStorage.getItem('att_'+pidClean)||'{"absent":0,"late":0}');}catch(e){return {absent:0,late:0};}
}
function setAtt(pidClean,field,val){
  const a=getAtt(pidClean);
  a[field]=Math.max(0,parseInt(val)||0);
  localStorage.setItem('att_'+pidClean,JSON.stringify(a));
}
function resetAtt(pidClean,e){
  e.stopPropagation();
  localStorage.setItem('att_'+pidClean,JSON.stringify({absent:0,late:0}));
  renderEmployees();
  toast('✓ 근태 초기화됨 (이 기기 기준)');
}

// ===== EMPLOYEES =====
function renderEmployees(){
  const emps=rows.filter(r=>r['진행상태']==='최종합격'&&!r['퇴사일']);
  const retired=rows.filter(r=>r['진행상태']==='최종합격'&&r['퇴사일']);
  retired.sort((a,b)=>(b['퇴사일']||'')<(a['퇴사일']||'')?-1:1);
  emps.sort((a,b)=>{const da=a['입사일'],db=b['입사일'];if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da<db?-1:da>db?1:0;});
  const sec=document.getElementById('empSection'),eEmpty=document.getElementById('empEmptyEl');
  if(!emps.length&&!retired.length){sec.style.display='none';if(eEmpty)eEmpty.style.display='block';return;}
  sec.style.display='block';if(eEmpty)eEmpty.style.display='none';
  document.getElementById('empCnt').textContent=emps.length+'명';
  const rtb=document.getElementById('retiredToggle');
  if(retired.length){rtb.style.display='inline-block';rtb.textContent=showRetired?'퇴사자 숨기기':'퇴사자 '+retired.length+'명 보기';}else rtb.style.display='none';
  document.getElementById('empGrid').innerHTML=emps.map((r,i)=>{
    const ten=r['입사일']?tenure(r['입사일']):'';
    const isOpen=empOpenIdx===i;
    const pid=r['id']||'',pidClean=pid.replace(/-/g,'');
    const imgUrl=r['이력서사진']||localStorage.getItem('img_'+pidClean);
    const empBirth=r['생년월일'];
    const empAgeStr=empBirth?`${new Date().getFullYear()-parseInt(empBirth.substring(0,4))}세`:'';
    const att=getAtt(pidClean);
    return `<div class="emp-card${isOpen?' open':''}" onclick="toggleEmp(${i})">
      <div class="emp-card-head">
        <div class="emp-avatar">${esc((r['이름']||'?').slice(0,1))}</div>
        <div><div class="emp-name">${esc(r['이름']||'')}</div>
        <div class="emp-role">${empAgeStr?empAgeStr+' · ':''}${esc(r['지원직무']||'')}${r['지원매장']?' · '+esc(r['지원매장']):''}</div></div>
        ${imgUrl?`<button class="resume-btn" onclick="event.stopPropagation();showResumeImg('${pidClean}','${imgUrl}')">🖼</button>`:''}
        ${ten?`<div class="emp-tenure">${ten}</div>`:''}
      </div>
      ${r['입사일']?`<div class="emp-hire">📅 입사 ${r['입사일'].substring(0,10)}</div>`:''}
      ${r['연락처']?`<div class="emp-hire" style="color:#475569">📞 ${esc(r['연락처'])}</div>`:''}
      <div style="margin-top:7px;display:flex;gap:10px;align-items:center;font-size:10px;color:var(--muted)" onclick="event.stopPropagation()">
        <span>결근 <input class="time-input att-input" type="number" min="0" value="${att.absent}" onchange="setAtt('${pidClean}','absent',this.value)"></span>
        <span>지각 <input class="time-input att-input" type="number" min="0" value="${att.late}" onchange="setAtt('${pidClean}','late',this.value)"></span>
        <button class="del-btn" style="padding:2px 7px;font-size:9px" onclick="resetAtt('${pidClean}',event)">초기화</button>
      </div>
      <div class="emp-detail"><div style="display:flex;gap:6px;align-items:center" onclick="event.stopPropagation()"><span style="font-size:10px;font-weight:700">📅 입사일</span><input class="time-input" type="date" value="${(r['입사일']||'').substring(0,10)}" onchange="saveHireDate('${r.id}',this)"></div><div style="margin-top:8px;text-align:right"><button class="del-btn" onclick="retireEmp('${r.id}','${esc(r['이름']||'')}',event)">퇴사 처리</button></div></div>
    </div>`;
  }).join('');
  if(showRetired&&retired.length){
    document.getElementById('empGrid').innerHTML+=retired.map(r=>`<div class="emp-card" style="opacity:.55;border-left-color:#94a3b8">
      <div class="emp-card-head">
        <div class="emp-avatar" style="background:#94a3b8">${esc((r['이름']||'?').slice(0,1))}</div>
        <div><div class="emp-name">${esc(r['이름']||'')}</div>
        <div class="emp-role">퇴사 ${(r['퇴사일']||'').substring(0,10)}</div></div>
        ${r['입사일']?`<div class="emp-tenure" style="color:#64748b;background:rgba(100,116,139,.12)">${tenure2(r['입사일'],r['퇴사일'])}</div>`:''}
      </div>
      ${r['입사일']?`<div class="emp-hire" style="color:#64748b">📅 ${r['입사일'].substring(0,10)} ~ ${(r['퇴사일']||'').substring(0,10)}</div>`:''}
      <div style="margin-top:8px;text-align:right"><button class="del-btn" onclick="deleteApplicant('${r.id}',event)">🗑 삭제</button></div>
    </div>`).join('');
  }
}
async function retireEmp(pageId,name,e){
  e.stopPropagation();
  if(!confirm(name+' 님을 퇴사 처리하시겠습니까? (오늘 날짜로 퇴사일 기록)'))return;
  const t=new Date(),pad=n=>String(n).padStart(2,'0');
  const d=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pageId,field:'퇴사일',value:d})});
    const dd=await r.json();
    if(!r.ok||dd.error)throw new Error(dd.error||'Error');
    toast('✓ 퇴사 처리 완료 ('+d+')');
    const rec=rows.find(x=>x.id===pageId);
    if(rec) rec['퇴사일']=d;
    empOpenIdx=null;
    renderAll();
  }catch(err){toast('퇴사 처리 실패: '+err.message,'err');}
}
async function saveHireDate(pageId,el){
  const v=el.value;
  if(!v)return;
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pageId,field:'입사일',value:v})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||'Error');
    toast('✓ 입사일 저장됨');
    const rec=rows.find(x=>x.id===pageId);
    if(rec) rec['입사일']=v;
    renderEmployees();renderStats();
  }catch(e){toast('저장 실패: '+e.message,'err');}
}
let showRetired=false;
function toggleRetired(){showRetired=!showRetired;renderEmployees();}
function tenure2(d1,d2){
  const s=new Date(d1.substring(0,10)),n=new Date(d2.substring(0,10));
  let y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth();
  if(n.getDate()<s.getDate())m--;
  if(m<0){y--;m+=12;}
  return (y>0?y+'년 ':'')+(m>0?m+'개월':y>0?'':'1개월 미만')+' 근무';
}
function toggleEmp(i){empOpenIdx=empOpenIdx===i?null:i;renderEmployees();}

// ===== PIPELINE =====
function renderPipeline(){
  const rej=cntRej();
  let h=PIPELINE.map((s,i)=>{
    const m=SM[s];
    return (i?'<span class="pipe-arrow">›</span>':'')+
      `<div class="pipe${flt===s?' active':''}" onclick="setFilter('${s}')">
        <div class="pipe-dot" style="background:${m.dot}"></div>
        <div class="pipe-info"><div class="pipe-name">${s}</div><div class="pipe-cnt">${cnt(s)}</div></div>
      </div>`;
  }).join('');
  if(rej) h+=`<span class="pipe-arrow">·</span>
    <div class="pipe${flt==='불합격'?' active':''}" onclick="setFilter('불합격')">
      <div class="pipe-dot" style="background:#ef4444"></div>
      <div class="pipe-info"><div class="pipe-name" style="color:#dc2626">불합격</div><div class="pipe-cnt" style="color:#dc2626">${rej}</div></div>
    </div>`;
  document.getElementById('pipeline').innerHTML=h;
}

// ===== FILTERS =====
function renderFilters(){
  const base=rows.filter(r=>r['진행상태']!=='최종합격');
  let h=`<div class="chip${flt==='all'?' active':''}" onclick="setFilter('all')">전체 ${base.length}</div>`;
  [...PIPELINE,'불합격'].forEach(s=>{
    const c=s==='불합격'?cntRej():cnt(s);
    if(!c)return;
    const m=SM[s];
    h+=`<div class="chip${flt===s?' active':''}" onclick="setFilter('${s}')" style="${flt===s?`border-color:${m.dot};color:${m.color};background:${m.bg}`:`color:${m.color}`}">${s} ${c}</div>`;
  });
  document.getElementById('filterRow').innerHTML=h;
}

function setFilter(f){flt=f;openIdx=null;renderPipeline();renderFilters();renderCards();}
function toggleCard(i){openIdx=openIdx===i?null:i;renderCards();}

// ===== MONTH FILTER (면접일 기준) =====
function monthLabel(ym,showYear){
  const [y,m]=ym.split('-');
  return (showYear?(y.slice(2)+'년 '):'')+parseInt(m,10)+'월';
}
function renderMonthFilters(){
  const base=rows.filter(r=>r['진행상태']!=='최종합격');
  const months=new Set();
  let hasNone=false;
  base.forEach(r=>{
    const d=r['면접일'];
    if(d) months.add(d.substring(0,7)); else hasNone=true;
  });
  const sorted=[...months].sort();
  const showYear=new Set(sorted.map(m=>m.slice(0,4))).size>1;
  const wrap=document.getElementById('monthFilterRow');
  if(!sorted.length&&!hasNone){wrap.innerHTML='';return;}
  let h=`<div class="chip${monthFlt==='all'?' active':''}" onclick="setMonthFilter('all')">전체 달</div>`;
  sorted.forEach(ym=>{
    h+=`<div class="chip${monthFlt===ym?' active':''}" onclick="setMonthFilter('${ym}')">${monthLabel(ym,showYear)}</div>`;
  });
  if(hasNone) h+=`<div class="chip${monthFlt==='none'?' active':''}" onclick="setMonthFilter('none')">미정</div>`;
  wrap.innerHTML=h;
}
function setMonthFilter(m){monthFlt=m;openIdx=null;renderMonthFilters();renderCards();}

// ===== CARDS =====
function renderCards(){
  let base=rows.filter(r=>r['진행상태']!=='최종합격');
  if(flt!=='all') base=base.filter(r=>flt==='불합격'?REJ.includes(r['진행상태']):r['진행상태']===flt);
  if(monthFlt!=='all'){
    base=base.filter(r=>{
      const d=r['면접일'];
      if(monthFlt==='none') return !d;
      return d&&d.substring(0,7)===monthFlt;
    });
  }
  // 면접일 기준 오름차순 정렬 (null 뒤로)
  base.sort((a,b)=>{
    const pa=a['진행상태']==='면접예정'?0:1,pb=b['진행상태']==='면접예정'?0:1;
    if(pa!==pb)return pa-pb;
    const da=a['면접일'],db=b['면접일'];
    if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;
    return da<db?-1:da>db?1:0;
  });
  const grid=document.getElementById('grid'),empty=document.getElementById('emptyEl');
  if(!base.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=base.map(row=>cardHTML(row,rows.indexOf(row))).join('');
}

        </div>

// ===== DELETE =====
async function deleteApplicant(pageId,e){
  e.stopPropagation();
  if(!confirm('이 지원자를 삭제하시겠습니까?'))return;
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pageId,action:'delete'})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||'Error');
    toast('✓ 삭제 완료');
    rows=rows.filter(row=>row.id!==pageId);
    openIdx=null;
    renderAll();
  }catch(e){toast('삭제 오류: '+e.message,'err');}

// ===== EVAL SAVE =====
async function saveEval(pageId,el){
  if(!pageId)return;
  const text=el.value;
  if(el.dataset.last===text)return;
  el.dataset.last=text;
  el.classList.add('saving');
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pageId,field:'경력이력서요약',value:text})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||'Error');
    toast('✓ 평가 저장됨');
    const rec=rows.find(r=>r.id===pageId);
    if(rec) rec['경력이력서요약']=text;
    el.classList.remove('saving');el.classList.add('saved');
    setTimeout(()=>el.classList.remove('saved'),1500);
  }catch(e){
    toast('저장 실패: '+e.message,'err');
    el.classList.remove('saving');
  }
}

// ===== GENERIC FIELD SAVE (면접 평가 상세) =====
async function saveField(pageId,field,value,el){
  if(!pageId)return;
  if(el){if(el.dataset.last===String(value))return;el.dataset.last=String(value);el.classList.add('saving');}
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pageId,field,value})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||'Error');
    const rec=rows.find(x=>x.id===pageId);
    if(rec) rec[field]=value;
    toast('✓ 저장됨');
    if(el){el.classList.remove('saving');el.classList.add('saved');setTimeout(()=>el.classList.remove('saved'),1200);}
    if(field==='평가점수') renderCards();
  }catch(e){
    toast('저장 실패: '+e.message,'err');
    if(el) el.classList.remove('saving');
  }
}

let _imgForAI=null;
function handleImgDrop(e){
  const file=e.dataTransfer.files[0];
  if(file) processImgFile(file);
}
function handleImgUpload(e){
  const file=e.target.files[0];
  if(file) processImgFile(file);
}
function processImgFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    const originalDataUrl=ev.target.result;
    _imgBase64=originalDataUrl.split(',')[1]; // 원본 고화질 (GitHub 저장용)
    _imgOrigUrl=originalDataUrl; // 화면 표시용
    const img=new Image();
    img.onload=()=>{
      // AI 분석용 압축 (최장변 1024px)
      const AI_MAX=1024;
      const scale=Math.min(AI_MAX/Math.max(img.width,img.height),1);
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      _imgForAI=canvas.toDataURL('image/jpeg',0.82).split(',')[1];
      // 미리보기: 원본
      document.getElementById('imgThumb').src=originalDataUrl;
      document.getElementById('imgPreviewWrap').style.display='block';
      document.getElementById('imgPlaceholder').style.display='none';
      document.getElementById('imgZone').classList.add('has-img');
      analyzeImg(_imgForAI);
    };
    img.src=originalDataUrl;
  };
  reader.readAsDataURL(file);
}
async function analyzeImg(b64){
  const status=document.getElementById('imgAiStatus');
  status.textContent='🤖 AI 분석 중...';status.className='img-ai-status loading-ai';
  try{
    const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'parse-image',imageBase64:b64})});
    const d=await r.json();
    if(d.ok&&d.data){
      const fd=d.data;
      if(fd['이름']) document.getElementById('f_name').value=fd['이름'];
      if(fd['생년월일']) document.getElementById('f_birth').value=fd['생년월일'];
      if(fd['연락처']) document.getElementById('f_contact').value=fd['연락처'];
      if(fd['경력이력서요약']) document.getElementById('f_memo').value=fd['경력이력서요약'];
      status.textContent='✓ AI 자동입력 완료 ('+( d.source||'AI')+')', status.className='img-ai-status done';
    }else{
      status.textContent='AI 분석 실패 — 수동 입력해주세요';status.className='img-ai-status';
    }
  }catch(e){
    status.textContent='분석 오류: '+e.message;status.className='img-ai-status';
  }
}

// ===== HELPERS =====
function df(l,v,w){return `<div class="df${w?' wide':''}"><label>${l}</label><p class="${v?'':'nil'}">${v?esc(v):'—'}</p></div>`;}
function starsHTML(s){const f=Math.round(Math.min(s,10)/10*5);let h='<div class="stars">';for(let i=0;i<5;i++)h+=`<span class="star${i>=f?' off':''}">★</span>`;return h+`<span class="score-tag">${s}점</span></div>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tenure(d){
  const s=new Date(d.substring(0,10)),n=new Date();
  let y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth();
  if(n.getDate()<s.getDate())m--;
  if(m<0){y--;m+=12;}
  return y>0?y+'년 '+m+'개월':m>0?m+'개월':'신규';
}
let _tid;
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show'+(type==='err'?' err':'');
  clearTimeout(_tid);_tid=setTimeout(()=>t.className='',2500);
}

// ===== PWA 설치(다운로드) =====
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;
  toast('✓ 바탕화면에 설치됨');
});
async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome}=await deferredPrompt.userChoice;
    deferredPrompt=null;
    if(outcome==='accepted') toast('✓ 설치 진행 중...');
    return;
  }
  const ua=navigator.userAgent;
  if(navigator.standalone || window.matchMedia('(display-mode: standalone)').matches){
    toast('이미 앱으로 설치되어 있어요');
    return;
  }
  if(/iPhone|iPad|iPod/.test(ua)){
    alert('iOS는 자동 설치를 지원하지 않아요.\n\n하단 공유 버튼(⬆) → "홈 화면에 추가"를 눌러주세요.');
  }else{
    alert('브라우저 설치 버튼을 찾을 수 없어요.\n\n주소창 오른쪽의 설치 아이콘(⊕/⬇) 또는\n메뉴(⋮) → "설치" / "홈 화면에 추가"를 눌러주세요.\n(Chrome/Edge 최신 버전 권장)');
  }
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
